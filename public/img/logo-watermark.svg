<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="پارس ۲۰۰۸">
  <title>پارس ۲۰۰۸ — watermark</title>
  <!-- ============================================================
       دارایی واترمارک برای خط لولهٔ موجود در src/services/images.js.
       هیچ کدی اینجا عوض نشده؛ فقط فایلی ساخته شده که همان خط لوله
       از قبل انتظارش را دارد (پارامتر watermark در processProductImage).

       خط لوله خودش این نشان را به ۲۲٪ عرضِ هر مشتق مقیاس می‌دهد و در
       گوشهٔ جنوب‌غربی می‌نشاند؛ پس اینجا نه اندازه تعیین می‌شود نه جا.

       شفافیت داخل خودِ فایل پخته شده است، چون خط لوله opacity را
       تنظیم نمی‌کند. سفیدِ نیمه‌شفاف با یک خطِ تیرهٔ بسیار کم‌رنگ
       ترکیب شده تا روی تصویر روشن *و* تیره خوانا بماند — قطعه‌ها
       معمولا روی زمینهٔ سفید عکس گرفته می‌شوند، ولی نه همیشه.
       ============================================================ -->
